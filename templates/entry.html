<article class="wrap letter-wrap">
  <header class="letter-head">
    <p class="label">{{t:journal}} &middot; {{date}}</p>
    <h1 class="letter-title" lang="{{post_lang}}">{{title}}</h1>
    <p class="meta-line"><span>{{lang_label}}</span><span class="status"><i class="dot {{status}}"></i>{{status_label}}</span></p>
  </header>
  {{image}}
  <div class="letter" lang="{{post_lang}}">
{{body}}
  </div>
  <nav class="letter-nav" aria-label="{{t:aria_more_pages}}">{{prev}}{{next}}</nav>
</article>

{{invite}}
