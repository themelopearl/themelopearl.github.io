<article class="wrap letter-wrap">
  <header class="letter-head">
    <p class="label">{{chapter_label}}</p>
    <h1 class="letter-title">{{headline}}</h1>
    <p class="meta-line"><span>{{years}}</span><span>{{ages}}</span></p>
  </header>
  <blockquote class="chapter-quote">&ldquo;{{quote}}&rdquo;</blockquote>
  <div class="letter" lang="{{body_lang}}">
{{body}}
  </div>
  <nav class="letter-nav" aria-label="{{t:aria_chapters}}">{{prev}}{{next}}</nav>
  <p class="note"><a href="{{p}}/about/#chapters"><span class="uline">{{t:all_chapters}}</span> &rarr;</a></p>
</article>

{{invite}}
