<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{og_type}}">
{{canonical}}
{{alternates}}
<link rel="icon" href="/assets/img/pearl.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Gowun+Batang&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css?v={{css_v}}">
</head>
<body>
<a class="skip" href="#main">{{t:skip}}</a>
<header class="wrap site-head">
  <a class="name" href="{{p}}/"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="f-must stk" cx="10" cy="10" r="7.5"/><circle class="f-paper" cx="7.6" cy="7.4" r="2"/></svg>{{site_name}}</a>
  <nav class="nav" aria-label="{{t:nav_label}}">
    <a href="{{p}}/journal/"><span class="uline">{{t:nav_journal}}</span></a>
    <a href="{{p}}/about/"><span class="uline">{{t:nav_story}}</span></a>
    <a href="{{p}}/cv/"><span class="uline">{{t:nav_cv}}</span></a>
    <a href="#write-back"><span class="uline">{{t:nav_hi}}</span></a>
  </nav>
  {{lang_switch}}
</header>
<main id="main">
{{main}}
</main>
<footer class="foot">
  <div class="wrap"><span>{{t:footer_made}}</span><span>&copy; {{year}} {{site_name}} &middot; <a href="/feed.xml"><span class="uline">RSS</span></a></span></div>
</footer>
<script>
(function(){var t=document.querySelector('.lang-toggle');if(!t)return;
window.addEventListener('pageshow',function(){t.classList.remove('flip')});
t.addEventListener('click',function(e){if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
e.preventDefault();t.classList.add('flip');setTimeout(function(){window.location.href=t.href},300)})})();
</script>
{{scripts}}
</body>
</html>
